    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(671.987031 75.046469)">Output</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(668.675313 86.244281)">y − C(y)</text>
   </g>
   <g id="text_8">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle" x="369.9" y="24.9408" transform="rotate(-0 369.9 24.9408)">Identity path</text>
   </g>
   <g id="text_9">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(49.18875 167.908469)">Shared components</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(85.105156 179.106281)">S, J, E</text>
   </g>
   <g id="text_10">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(254.736875 161.978937)">Four paired observations</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(241.360312 173.22925)">E  |  S + E  |  J + E  |  S + J + E</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(238.030625 184.757687)">Correction labels: 0  |  0  |  J  |  J</text>
   </g>
   <g id="text_11">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(513.626875 162.309562)">Shared single-pulse network</text>
