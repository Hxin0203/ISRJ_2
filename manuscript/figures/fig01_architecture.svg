   <g id="text_13">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(140.267266 277.889719)">U-Net: 2×1800 → 16×1800 → 32×900 → 64×450 → 32×900 → 16×1800 → 2×1800</text>
