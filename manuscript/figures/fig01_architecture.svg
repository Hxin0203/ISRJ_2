    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(217.965156 87.080109)">D = diag(q*)</text>
   </g>
   <g id="text_4">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(332.050156 74.762516)">Residual U-Net</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(340.99625 87.080109)">16 / 32 / 64</text>
   </g>
   <g id="text_5">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(451.382734 74.762516)">Inverse dechirp</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(476.780703 87.080109)">× a(y)</text>
   </g>
   <g id="text_6">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(574.413672 74.762516)">Correction</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(591.477422 87.080109)">C(y)</text>
   </g>
